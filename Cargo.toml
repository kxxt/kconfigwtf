[package]
name = "kconfigwtf"
version = "0.1.0"
edition = "2024"
description = "Linux kernel config explorer and distribution config indexer"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ext4-view = { version = "0.9.3", features = ["std"] }
flate2 = "1.0"
futures-util = "0.3"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indicatif = "0.17"
minijinja = "2.7"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
liblzma = "0.4"
zstd = "0.13"
ar = "0.9"
walkdir = "2.5"
regex = "1"
percent-encoding = "2.3"
rpm = { version = "0.23.5", default-features = false, features = ["payload", "gzip-compression", "xz-compression", "zstd-compression", "bzip2-compression"] }
quick-xml = "0.38"
bzip2 = { version = "0.6.1", default-features = false, features = ["bzip2-sys"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"
