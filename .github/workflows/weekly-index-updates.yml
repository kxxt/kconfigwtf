name: Weekly Index Updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-index-updates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPDATE_BRANCH: automated/weekly-index-updates-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare-branch:
    name: Prepare update branch
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT secret
        env:
          INDEX_UPDATE_TOKEN: ${{ secrets.PAT }}
        run: |
          test -n "$INDEX_UPDATE_TOKEN" || {
            echo "The PAT repository secret is required for weekly index update PRs."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: weekly-index-release
      - name: Build indexer binary
        run: cargo build --release --locked
      - name: Pack indexer binary
        run: |
          set -euo pipefail
          mkdir -p .ci/bin
          cp target/release/kconfigwtf .ci/bin/kconfigwtf
      - name: Upload indexer binary
        uses: actions/upload-artifact@v4
        with:
          name: kconfigwtf-indexer
          path: .ci/bin/kconfigwtf
          if-no-files-found: error
          retention-days: 1
      - name: Reset update branch to current base
        run: |
          set -euo pipefail
          git checkout -B "$UPDATE_BRANCH"
          git push --force origin "HEAD:$UPDATE_BRANCH"

  update-distro:
    name: Update ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: prepare-branch
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: almalinux
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index almalinux --release 10 --max-packages 15 --data-dir data --arch x86_64 --arch x86_64_v2 --arch aarch64 --arch ppc64le --arch s390x
              && ./.ci/bin/kconfigwtf index almalinux --release 9 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch ppc64le --arch s390x
              && ./.ci/bin/kconfigwtf index almalinux --release 8 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch ppc64le --arch s390x
          - distro: alpine
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index alpine --release latest-stable --repository main --repository community --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch s390x --arch armv7 --arch armhf --arch ppc64le --arch x86
          - distro: amazonlinux
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index amazonlinux --release al2023 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
          - distro: android
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index android --branch android16-6.12 --branch android15-6.6 --branch android14-6.1 --branch android14-5.15 --branch android13-5.15 --branch android13-5.10 --branch android12-5.10 --max-builds 5 --data-dir data
          - distro: aoscos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index aosc --suite stable --component main --max-packages 15 --data-dir data --arch amd64 --arch arm64 --arch riscv64 --arch loongarch64 --arch loongson3 --arch ppc64el
          - distro: archlinux
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index arch --distribution archlinux --repository core --max-packages 15 --data-dir data --arch x86_64
              && ./.ci/bin/kconfigwtf index arch --distribution archlinux --repository extra --max-packages 15 --data-dir data --arch x86_64
              && ./.ci/bin/kconfigwtf index arch --distribution archlinux --repository core --data-dir data --arch riscv64
              && ./.ci/bin/kconfigwtf index arch --distribution archlinux --repository extra --data-dir data --arch riscv64
              && ./.ci/bin/kconfigwtf index arch --distribution archlinux --repository unsupported --data-dir data --arch riscv64
          - distro: azurelinux
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index azurelinux --release 3.0 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
          - distro: cachyos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index arch --distribution cachyos --repository cachyos --max-packages 15 --data-dir data --arch x86_64
              && ./.ci/bin/kconfigwtf index arch --distribution cachyos --repository cachyos-v3 --max-packages 15 --data-dir data --arch x86_64_v3
              && ./.ci/bin/kconfigwtf index arch --distribution cachyos --repository cachyos-v4 --max-packages 15 --data-dir data --arch x86_64_v4
          - distro: centos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index centos --release 10-stream --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch ppc64le --arch s390x
              && ./.ci/bin/kconfigwtf index centos --release 9-stream --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch ppc64le --arch s390x
          - distro: chromeos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index chromeos --arch amd64 --data-dir data
          - distro: debian
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index debian --suite trixie --component main --max-packages 25 --data-dir data --arch amd64 --arch arm64 --arch armhf --arch i386 --arch ppc64el --arch s390x
          - distro: deepin
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index deepin --suite beige --component main --max-packages 15 --data-dir data --arch amd64 --arch arm64 --arch riscv64 --arch loong64
          - distro: eweos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index eweos --repository main --max-packages 15 --data-dir data --arch x86_64 --arch riscv64 --arch aarch64 --arch loongarch64
          - distro: fedora
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index fedora --release rawhide --max-packages 5 --data-dir data --arch x86_64 --arch aarch64 --arch riscv64 --arch s390x --arch ppc64le
          - distro: guix
            setup: sudo apt-get update && sudo apt-get install -y guix
            command: >-
              ./.ci/bin/kconfigwtf index guix --package linux-libre --max-packages 1 --data-dir data --arch x86_64
          - distro: kali
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index kali --suite kali-rolling --component main --max-packages 15 --data-dir data --arch amd64 --arch arm64 --arch armhf
          - distro: nixos
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index nixos --max-packages 1 --data-dir data --arch x86_64
          - distro: openanolis
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index openanolis --release 23.4 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch loongarch64
              && ./.ci/bin/kconfigwtf index openanolis --release 8.10 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch loongarch64
              && ./.ci/bin/kconfigwtf index openanolis --release 7.9 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
          - distro: openeuler
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index openeuler --release openEuler-24.03-LTS-SP3 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch loongarch64
          - distro: openkylin
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index openkylin --suite nile --component main --max-packages 15 --data-dir data --arch amd64 --arch arm64 --arch riscv64 --arch loong64
          - distro: opensuse
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index opensuse --release tumbleweed --max-packages 15 --data-dir data --arch x86_64 --arch riscv64 --arch aarch64 --arch ppc64le --arch s390x --arch armhf
              && ./.ci/bin/kconfigwtf index opensuse --release 16.1 --max-packages 15 --data-dir data --arch x86_64 --arch s390x --arch aarch64 --arch ppc64le
          - distro: openwrt
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index openwrt --targets-url https://downloads.openwrt.org/snapshots/targets --target x86/64 --target rockchip/armv8 --data-dir data
          - distro: oraclelinux
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index oraclelinux --release 10 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
              && ./.ci/bin/kconfigwtf index oraclelinux --release 9 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
              && ./.ci/bin/kconfigwtf index oraclelinux --release 8 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
          - distro: parabola
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index arch --distribution parabola --max-packages 15 --data-dir data --arch x86_64
          - distro: proxmox
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index proxmox --suite bookworm --component pve-no-subscription --max-packages 15 --data-dir data --arch amd64
          - distro: rocky
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index rocky --release 10 --max-packages 15 --data-dir data --arch x86_64 --arch riscv64 --arch aarch64 --arch ppc64le --arch s390x
              && ./.ci/bin/kconfigwtf index rocky --release 9 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64 --arch ppc64le --arch s390x
              && ./.ci/bin/kconfigwtf index rocky --release 8 --max-packages 15 --data-dir data --arch x86_64 --arch aarch64
          - distro: ubuntu
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index ubuntu --suite noble-updates --component main --max-packages 25 --data-dir data --arch amd64
              && ./.ci/bin/kconfigwtf index ubuntu --suite noble-updates --component main --mirror http://ports.ubuntu.com/ubuntu-ports/ --max-packages 25 --data-dir data --arch arm64 --arch armhf --arch riscv64 --arch ppc64el --arch s390x
          - distro: void
            setup: ""
            command: >-
              ./.ci/bin/kconfigwtf index void --max-packages 15 --data-dir data --arch amd64 --arch arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Download indexer binary
        uses: actions/download-artifact@v4
        with:
          name: kconfigwtf-indexer
          path: .ci/bin
      - name: Prepare indexer binary
        run: chmod +x .ci/bin/kconfigwtf
      - name: Install Nix
        if: matrix.distro == 'nixos'
        uses: cachix/install-nix-action@v31
      - name: Run index update
        id: index
        env:
          INDEX_COMMAND: ${{ matrix.command }}
          SETUP_COMMAND: ${{ matrix.setup }}
          EXTRACT_IKCONFIG: ${{ github.workspace }}/scripts/extract-ikconfig
        run: |
          set -uo pipefail
          mkdir -p status
          status_file="status/${{ matrix.distro }}.md"
          log_file="status/${{ matrix.distro }}.log"

          {
            echo "### ${{ matrix.distro }}"
            echo
            if [[ -n "$SETUP_COMMAND" ]]; then
              echo "Setup:"
              echo
              echo '```sh'
              printf '%s\n' "$SETUP_COMMAND"
              echo '```'
              echo
            fi
            echo '```sh'
            printf '%s\n' "$INDEX_COMMAND"
            echo '```'
            echo
          } > "$status_file"

          if {
            if [[ -n "$SETUP_COMMAND" ]]; then
              bash -euxo pipefail -c "$SETUP_COMMAND"
            fi
            bash -euxo pipefail -c "$INDEX_COMMAND"
          } > >(tee "$log_file") 2>&1; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "Status: success" >> "$status_file"
          else
            code=$?
            echo "result=failure" >> "$GITHUB_OUTPUT"
            {
              echo "Status: failed with exit code ${code}"
              echo
              echo "Last log lines:"
              echo
              echo '```text'
              tail -n 80 "$log_file"
              echo '```'
            } >> "$status_file"
          fi
      - name: Discard failed update changes
        if: steps.index.outputs.result != 'success'
        run: git restore --staged --worktree -- "data/${{ matrix.distro }}" || true
      - name: Commit and push distro update
        if: steps.index.outputs.result == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -- "data/${{ matrix.distro }}"

          status_file="status/${{ matrix.distro }}.md"
          if git diff --cached --quiet; then
            echo "Changed: no" >> "$status_file"
            exit 0
          fi

          git commit -m "Update ${{ matrix.distro }} kernel indexes"
          echo "Changed: yes" >> "$status_file"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$UPDATE_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH"; then
              git rebase "origin/$UPDATE_BRANCH"
            fi
            if git push origin "HEAD:$UPDATE_BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done

          exit 1
      - name: Upload update status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-status-${{ matrix.distro }}
          path: status/${{ matrix.distro }}.*
          if-no-files-found: warn
      - name: Mark failed update
        if: steps.index.outputs.result == 'failure'
        run: exit 1

  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    needs:
      - prepare-branch
      - update-distro
    if: always() && needs.prepare-branch.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - uses: actions/download-artifact@v4
        with:
          pattern: update-status-*
          path: status
          merge-multiple: true
      - name: Build pull request body
        run: |
          set -euo pipefail
          {
            echo "Weekly kernel package index update."
            echo
            echo "Each distro ran in an isolated matrix job. Successful updates were committed separately; failed updates were left out of the branch."
            echo
            for file in status/*.md; do
              test -e "$file" || continue
              cat "$file"
              echo
            done
          } > pr-body.md
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          git fetch origin "$UPDATE_BRANCH"
          if git diff --quiet "origin/${{ github.event.repository.default_branch }}" "origin/$UPDATE_BRANCH"; then
            echo "No committed index updates; skipping pull request."
            exit 0
          fi

          pr_number="$(gh pr list \
            --head "$UPDATE_BRANCH" \
            --base "${{ github.event.repository.default_branch }}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "Update kernel package indexes" \
              --body-file pr-body.md
          else
            gh pr create \
              --head "$UPDATE_BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "Update kernel package indexes" \
              --body-file pr-body.md
          fi
